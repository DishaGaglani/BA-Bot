name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published dependency advisories surface without a PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.16.8 mypy==2.3.1 types-requests
      # Config lives in backend/ruff.toml and backend/mypy.ini.
      - run: ruff check .
      - run: mypy .

  backend-tests:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      # The suite is hermetic (throwaway DB, no network), so no secrets are needed.
      - name: Run tests
        if: hashFiles('backend/tests/**/test_*.py') != ''
        run: python -m pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    # Reports known-vulnerable pins in requirements.txt without blocking merges.
    # Several current pins (starlette, PyJWT, urllib3, python-dotenv) have
    # published advisories; remove continue-on-error once they are upgraded.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # Pinned binary instead of gitleaks-action, which needs a paid license
      # for organization-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --no-banner --redact --verbose

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  podman-build:
    name: Podman build (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Podman is our primary production container runtime (rootless, daemonless), separate
    # from the docker-build job above: this proves the same Dockerfiles build under Podman
    # too, without ever needing a Docker daemon or elevated privileges.
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - name: Build image with Podman
        run: podman build -t ba-bot-${{ matrix.service }}:ci ./${{ matrix.service }}

  podman-compose-check:
    name: Podman Compose compatibility
    runs-on: ubuntu-latest
    # Validates docker-compose.yml resolves cleanly under podman-compose (service definitions,
    # volumes, env, dependency graph) without actually starting the stack, so this doesn't need
    # the real PREDICTION_URL/secrets a live run would.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # podman-compose shells out to the podman binary itself even just to resolve config,
      # so it isn't enough to install the podman-compose package alone (same check as the
      # podman-build job above, each GitHub Actions job gets its own clean runner).
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - run: pip install podman-compose
      - run: podman-compose -f docker-compose.yml config
