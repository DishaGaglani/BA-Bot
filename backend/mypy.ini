[mypy]
python_version = 3.11
explicit_package_bases = True
ignore_missing_imports = True
exclude = (^|/)(tests|uploads)/
# The models use legacy declarative `Column(...)` attributes, so mypy sees
# Column[str] where the runtime value is str. Those two codes are pure noise
# here; every other check stays on.
disable_error_code = arg-type, assignment

# slowapi -> limits -> Deprecated ships py.typed, so mypy follows it into source that uses
# PEP 695 `type` statements (Python 3.12+ only) and fails to parse under our python_version
# 3.11 target. It's a transitive dependency we never import directly; skip it entirely.
[mypy-deprecated.*]
ignore_errors = True
follow_imports = skip
