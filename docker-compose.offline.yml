services:
  backend:
    image: ba-backend:latest
    container_name: ba-backend
    restart: always
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET=production_secret_key_change_me_to_something_secure_and_long
      - DATABASE_URL=sqlite:////app/data/ba_bot.db
      - PREDICTION_URL=https://172.16.34.7:3000/api/v1/prediction/09ee3d2d-5d65-4793-a217-abd65e837366
      - FRONTEND_URL=http://localhost,http://127.0.0.1
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    image: ba-frontend:latest
    container_name: ba-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
