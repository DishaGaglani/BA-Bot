# Same as docker-compose.yml, but runs pre-built images (ba-backend:latest / ba-frontend:latest)
# instead of building them — for an offline/air-gapped host where the images are loaded via
# `docker load`. See docker-compose.yml for what each setting below does.
services:
  backend:
    image: ba-backend:latest
    container_name: ba-backend
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    pids_limit: 512
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET=production_secret_key_change_me_to_something_secure_and_long
      - DATABASE_URL=sqlite:////app/data/ba_bot.db
      - PREDICTION_URL=https://172.16.34.7:3000/api/v1/prediction/09ee3d2d-5d65-4793-a217-abd65e837366
      - FRONTEND_URL=http://localhost,http://127.0.0.1
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    image: ba-frontend:latest
    container_name: ba-frontend
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    pids_limit: 128
    mem_limit: 128m
    cpus: 1
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
