version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ba-backend
    restart: always
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET=production_secret_key_change_me_to_something_secure_and_long
      - DATABASE_URL=sqlite:////app/data/ba_bot.db
      - PREDICTION_URL=https://forjinn.com/api/v1/prediction/249fc96e-5b62-4208-8787-0d77367e9eaf
      - FRONTEND_URL=http://localhost,http://127.0.0.1
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ba-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
