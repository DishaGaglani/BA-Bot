version: '3.8'

# Resource limits and worker count are sized for a small single-host deployment. Raise
# backend cpus/mem_limit (and WEB_CONCURRENCY, which otherwise auto-sizes from these same
# limits — see backend/gunicorn.conf.py) for a bigger server.
#
# Security baseline applied to both services: no-new-privileges, all Linux capabilities
# dropped except the few each process actually needs, and init (an embedded tini) so
# SIGTERM from `docker compose stop` reaches the app and triggers a graceful shutdown
# instead of a hard kill after the stop timeout. CAP_KILL is part of that minimal set for
# exactly that reason: tini runs as root and needs it to forward the signal to the app
# process, which by then has dropped to an unprivileged user.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ba-backend
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # entrypoint: fix ownership of volumes on first run / upgrade from an older image
      - SETUID   # entrypoint: drop from root to the unprivileged app user
      - SETGID
      - KILL     # tini (init: true above) forwarding SIGTERM to that now-unprivileged process
    pids_limit: 512
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET=production_secret_key_change_me_to_something_secure_and_long
      - DATABASE_URL=sqlite:////app/data/ba_bot.db
      - PREDICTION_URL=https://172.16.34.7:3000/api/v1/prediction/09ee3d2d-5d65-4793-a217-abd65e837366
      - FRONTEND_URL=http://localhost,http://127.0.0.1
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    expose:
      - "8000"
    # Dockerfile's HEALTHCHECK (liveness only) is inherited; `depends_on` below waits for it.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ba-frontend
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # nginx master binds the privileged port 80
      - CHOWN             # nginx master: drop worker processes to the unprivileged `nginx` user
      - SETUID
      - SETGID
      - KILL              # tini forwarding SIGTERM, as above
    pids_limit: 128
    mem_limit: 128m
    cpus: 1
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
